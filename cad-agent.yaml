# cad-agent project definition (toolkit: Valpatel/cad-agent, docs/toolkit.md). Run from this directory:
#   .venv/bin/cad-agent all      # build, 3MF, check + report, package
#   .venv/bin/cad-agent serve    # local preview + Bambu Studio links
cad:
  name: j501-agx
  title: reServer J501 / Jetson AGX Orin enclosure
  revision_from: cad/parameters.json:revision
  printer: {name: Bambu Lab P1S, bed_mm: [256, 256, 256]}
  steps:
    - {name: build,             run: cad/build.py,              log: build.log}
    - {name: clearances,        run: tools/check_clearances.py, log: carrier-clearances.log, needs: [build], timeout_s: 5400}
    - {name: shells,            run: tools/check_shells.py,     log: shell-clearances.log, needs: [build]}
    - {name: ports,             run: tools/check_ports.py,      log: port-checks.log, needs: [build]}
    - {name: assembly-paths,    run: tools/assembly_paths.py,   log: assembly-paths.log, needs: [build]}
    - {name: print-review,      run: tools/print_review.py,     needs: [build]}
    - {name: design-metrics,    run: tools/design_metrics.py,   log: design-metrics.log, needs: [build]}
    - {name: mounts,            run: tools/check_mounts.py,     needs: [build]}
    - {name: storage,           run: tools/check_storage.py,    needs: [build]}
    - {name: cable-diagram,     run: tools/cable_diagram.py,    needs: [build]}
    - {name: docs,              run: tools/write_docs.py}
    - {name: check-sheet,       run: tools/check_sheet.py}
    - {name: detailed-assembly, run: tools/detailed_assembly.py, log: detailed-assembly.log}
    - {name: render,            run: tools/render.py,           log: render.log}
    - {name: assembly-steps,    run: tools/render_steps.py,     needs: [build]}
    - {name: readmes,           run: tools/write_readmes.py,    needs: [print-review]}
    - {name: structure,         run: tools/structure.py,        log: structure.log, needs: [build], timeout_s: 5400}
    - {name: heatsink-study,    run: tools/heatsink_study.py}
    - {name: simulation,        run: tools/check_sim.py,        log: simulation-checks.log}
    - {name: sim-report,        run: tools/sim_report.py}
    - {name: validate,          run: tools/validate_review.py}
  part_ids: {base: P1, base_mount: P1M, cover: P2, front_gmsl: P3, front_no_gmsl: P4, rear_io: P5,
             mount_fit_template: P9, side_hatch: P10, m3_insert_coupon: P11, rail_coupon: P12,
             rail_key: P13, countersink_coupon: P14, storage_35: P15, storage_25: P16,
             storage_mount_plate: P17, chimney_cap: P18, ssd_clip: P19, rpsma_coupon: P20}
  checks:
    - {id: carrier, title: Carrier and hardware clearances, file: exports/carrier-clearances.json, evidence: [preview/open.png]}
    - {id: shells,  title: Open-shell clearances,           file: exports/shell-clearances.json}
    - {id: paths,   title: Plate insertion paths,           file: exports/assembly-paths.json, evidence: [preview/exploded.png]}
    - {id: ports,   title: Mated plug fit at every port,    file: exports/port-checks.json, evidence: [preview/port-fit.png]}
    - {id: mounts,  title: Mounting tabs and driver access, file: exports/mount-checks.json, evidence: [preview/mount-clearance.png]}
    - {id: storage, title: "Storage trays, cable routes and underside slots", file: exports/storage-checks.json, evidence: [preview/cable-routing.png]}
    - {id: simulation, title: "Strength, airflow and filament (simulation)", file: exports/simulation-checks.json, evidence: [preview/simulation.html]}
    - id: review
      title: Review validation
      file: exports/review-validation.json
      pass_key: [all_parts_single_valid_watertight, plastic_intersections_zero, carrier_and_hardware_pass,
                 open_shell_pass, port_plug_fit_pass, mount_checks_pass, storage_checks_pass, assembly_paths_pass, nominal_P1S_bounds_pass]
  package:
    name: j501-agx-rev09-fit-check
    include: [README.md, ASSEMBLY.md, "docs/assembly/*", requirements.txt, cad/parameters.json, "docs/*", "exports/*.stl", "exports/*.3mf",
              "exports/*.step", "exports/*.json", references/sources.json]
  # cad-agent slice: real grams and print time for the enclosure set (Bambu Studio CLI, P1S 0.20 Standard, PLA Basic)
  slicer: {filament: pla, parts: [base, cover, front_no_gmsl, rear_io, side_hatch]}
  html_pages: [preview/index.html, README.md, ASSEMBLY.md, docs/engineering-review.html]
  view:
    colors: {base: "#2f343c", base_mount: "#2f343c", cover: "#3b3f46", front_gmsl: "#8a9099", front_no_gmsl: "#8a9099",
             rear_io: "#8a9099", side_hatch: "#8a9099", chimney_cap: "#5aa9e6"}
    hidden: [base_mount, front_gmsl, mount_fit_template, m3_insert_coupon, countersink_coupon, rpsma_coupon, rail_coupon, rail_key,
             storage_35, storage_25, storage_mount_plate, ssd_clip]
  # project site: `cad-agent site --serve` (http://127.0.0.1:8643/site/). The top bar below is on every page it serves.
  site:
    title: J501 AGX enclosure
    tagline: A printed enclosure for the Seeed reServer J501 carrier with a Jetson AGX Orin, its cooler, antennas and drives
    milestones: docs/milestones.yaml
    pages: [README.md, ASSEMBLY.md, "docs/README.md", "exports/README.md", "cad/README.md", "tools/README.md",
            "preview/README.md", "references/README.md", "docs/assembly/README.md"]
    live_reload: {watch: [preview, docs, exports, site]}
    nav:
      - {id: overview, title: Overview, href: site/}
      - {id: renders, title: Renders, href: preview/index.html}
      - {id: model, title: 3D model, href: _cadagent/kit/viewer.html}
      - {id: simulation, title: Simulation, href: preview/simulation.html}
      - {id: review, title: Engineering review, href: docs/engineering-review.html}
      - {id: checks, title: Checks, href: docs/cad-agent-report.html}
      - {id: print, title: Print files, href: site/pages/exports-readme-md.html}
      - {id: assembly, title: Assembly, href: site/pages/assembly-md.html}
      - {id: docs, title: Docs, href: "site/#documents"}
      - {id: repo, title: Repository, href: "https://github.com/mvalancy/j501-agx-orin"}
