# cad-agent project definition (toolkit: Valpatel/cad-agent, docs/toolkit.md). Run from this directory:
#   .venv/bin/cad-agent all      # build, 3MF, check + report, package
#   .venv/bin/cad-agent serve    # local preview + Bambu Studio links
cad:
  name: j501-agx
  title: reServer J501 / Jetson AGX Orin enclosure
  revision_from: cad/parameters.json:revision
  printer: {name: Bambu Lab P1S, bed_mm: [256, 256, 256]}
  steps:
    - {name: build,             run: cad/build.py,              log: build.log}
    - {name: clearances,        run: tools/check_clearances.py, log: carrier-clearances.log, needs: [build], timeout_s: 5400}
    - {name: shells,            run: tools/check_shells.py,     log: shell-clearances.log, needs: [build]}
    - {name: ports,             run: tools/check_ports.py,      log: port-checks.log, needs: [build]}
    - {name: assembly-paths,    run: tools/assembly_paths.py,   log: assembly-paths.log, needs: [build]}
    - {name: print-review,      run: tools/print_review.py,     needs: [build]}
    - {name: design-metrics,    run: tools/design_metrics.py,   log: design-metrics.log, needs: [build]}
    - {name: mounts,            run: tools/check_mounts.py,     needs: [build]}
    - {name: cooler-study,      run: tools/cooler_fit_review.py, log: cooler-study.log, needs: [build], timeout_s: 3600}
    - {name: view,              run: tools/view_model.py,       log: view.log, needs: [build, cooler-study]}
    - {name: storage,           run: tools/check_storage.py,    needs: [build]}
    - {name: cable-diagram,     run: tools/cable_diagram.py,    needs: [build]}
    - {name: docs,              run: tools/write_docs.py}
    - {name: check-sheet,       run: tools/check_sheet.py}
    - {name: detailed-assembly, run: tools/detailed_assembly.py, log: detailed-assembly.log}
    - {name: render,            run: tools/render.py,           log: render.log}
    - {name: assembly-steps,    run: tools/render_steps.py,     needs: [build]}
    - {name: readmes,           run: tools/write_readmes.py,    needs: [print-review]}
    - {name: structure,         run: tools/structure.py,        log: structure.log, needs: [build], timeout_s: 5400}
    - {name: heatsink-study,    run: tools/heatsink_study.py}
    - {name: simulation,        run: tools/check_sim.py,        log: simulation-checks.log}
    - {name: sim-report,        run: tools/sim_report.py}
    - {name: validate,          run: tools/validate_review.py}
  part_ids: {base: P1, base_mount: P1M, cover: P2, front_gmsl: P3, front_no_gmsl: P4, rear_io: P5,
             mount_fit_template: P9, side_hatch: P10, m3_insert_coupon: P11, rail_coupon: P12,
             rail_key: P13, countersink_coupon: P14, storage_35: P15, storage_25: P16,
             storage_mount_plate: P17, chimney_cap: P18, ssd_clip: P19, rpsma_coupon: P20}
  checks:
    - {id: carrier, title: Carrier and hardware clearances, file: exports/carrier-clearances.json, evidence: [preview/open.png]}
    - {id: shells,  title: Open-shell clearances,           file: exports/shell-clearances.json}
    - {id: paths,   title: Plate insertion paths,           file: exports/assembly-paths.json, evidence: [preview/exploded.png]}
    - {id: ports,   title: Mated plug fit at every port,    file: exports/port-checks.json, evidence: [preview/port-fit.png]}
    - {id: mounts,  title: Mounting tabs and driver access, file: exports/mount-checks.json, evidence: [preview/mount-clearance.png]}
    - {id: storage, title: "Storage trays, cable routes and underside slots", file: exports/storage-checks.json, evidence: [preview/cable-routing.png]}
    - {id: simulation, title: "Strength, airflow and filament (simulation)", file: exports/simulation-checks.json, evidence: [preview/simulation.html]}
    - id: review
      title: Review validation
      file: exports/review-validation.json
      pass_key: [all_parts_single_valid_watertight, plastic_intersections_zero, carrier_and_hardware_pass,
                 open_shell_pass, port_plug_fit_pass, mount_checks_pass, storage_checks_pass, assembly_paths_pass, nominal_P1S_bounds_pass]
  package:
    name: j501-agx-rev09-fit-check
    include: [README.md, ASSEMBLY.md, "docs/assembly/*", requirements.txt, cad/parameters.json, "docs/*", "exports/*.stl", "exports/*.3mf",
              "exports/*.step", "exports/*.json", references/sources.json]
  # cad-agent slice: real grams and print time for every printed part (Bambu Studio CLI, P1S 0.20 Standard, PLA Basic);
  # the release page shows them per part. tools/sim_report.py compares the five-part enclosure set across revisions.
  slicer: {filament: pla}
  # cad-agent holes (run by `all`): every hole of every part clear of material. The RP-SMA holes are D-holes on purpose.
  # An `at` point matches the hole's axis line, so each base entry also covers the coaxial hole in the opposite wall
  # (4 D-holes per base). An exception skips the whole hole: look at these in a section view when the walls change.
  holes:
    exceptions:
      base: &rpsma
        - {at: [1.25, 46.5, 62], diameter_mm: 6.6, reason: "RP-SMA bulkhead D-hole: the flat stops the bulkhead turning (antenna_bulkheads)"}
        - {at: [1.25, 145.5, 62], diameter_mm: 6.6, reason: "RP-SMA bulkhead D-hole: the flat stops the bulkhead turning (antenna_bulkheads)"}
      base_mount: *rpsma
      rpsma_coupon:
        - {diameter_mm: 6.6, reason: "the coupon's four RP-SMA D-holes, flats 5.9 to 6.2 mm across, to pick the one that holds"}
  html_pages: [preview/index.html, README.md, ASSEMBLY.md, docs/engineering-review.html]
  view:
    colors: {base: "#2f343c", base_mount: "#2f343c", cover: "#3b3f46", front_gmsl: "#8a9099", front_no_gmsl: "#8a9099",
             rear_io: "#8a9099", side_hatch: "#8a9099", chimney_cap: "#5aa9e6"}
    hidden: [base_mount, front_gmsl, mount_fit_template, m3_insert_coupon, countersink_coupon, rpsma_coupon, rail_coupon, rail_key,
             storage_35, storage_25, storage_mount_plate, ssd_clip]
    # One viewer for everything (tools/view_model.py): each category is a section of the parts list with a show-all box.
    # The carrier board and the AGX module come from the local vendor references (not redistributed); without them they
    # are listed as not exported.
    parts_category: Printed parts
    categories:
      Alternatives and test coupons: [base_mount, front_gmsl, mount_fit_template, m3_insert_coupon, countersink_coupon, rpsma_coupon,
                                      rail_coupon, rail_key]
      Storage options: [storage_35, storage_25, storage_mount_plate, ssd_clip]
    extra:
      - {name: spreader, file: exports/cooler-study/spreader.step, color: "#bb743e", category: "Cooler (reComputer mini J501)"}
      - {name: spacers, file: exports/cooler-study/spacers.step, color: "#d9b062", category: "Cooler (reComputer mini J501)"}
      - {name: cold_plate, file: exports/cooler-study/cold_plate.step, color: "#c98a5a", category: "Cooler (reComputer mini J501)"}
      - {name: heat_pipes, file: exports/cooler-study/heat_pipes.step, color: "#d4b896", category: "Cooler (reComputer mini J501)"}
      - {name: fins, file: exports/cooler-study/fins.step, color: "#929ca3", category: "Cooler (reComputer mini J501)"}
      - {name: mount_ears, file: exports/cooler-study/mount_ears_provisional.step, color: "#ac9e8b", category: "Cooler (reComputer mini J501)"}
      - {name: fan_frame, file: exports/cooler-study/fan_frame.step, color: "#303b46", category: "Cooler (reComputer mini J501)"}
      - {name: fan_rotor, file: exports/cooler-study/fan_rotor.step, color: "#111a23", category: "Cooler (reComputer mini J501)"}
      - {name: carrier_board, file: references/hardware/carrier-full.stl, offset: [15, 15, 20], color: "#2f6b4f", category: Carrier board and module}
      - {name: agx_module, file: exports/view-context/agx_module.step, color: "#5d6970", category: Carrier board and module}
      - {name: board_outline, file: exports/cooler-study/pcb_reference.step, color: "#347857", category: Carrier board and module, hidden: true}
      - {name: lid_screws, file: exports/view-context/lid_screws.step, color: "#b8bec6", category: Screws and hardware}
      - {name: board_screws, file: exports/view-context/board_screws.step, color: "#c9a227", category: Screws and hardware}
      - {name: cooler_tiedown_screws, file: exports/view-context/cooler_tiedown_screws.step, color: "#b8bec6", category: Screws and hardware}
      - {name: antenna_bulkheads, file: exports/view-context/antenna_bulkheads.step, color: "#c9a227", category: Screws and hardware}
  # cad-agent release (tools/package_release.py): the print page with every part, its settings and files, and the source.
  release:
    title: reServer J501 / Jetson AGX Orin enclosure
    groups:
      - title: Enclosure (every build)
        note: Print these three, one base and one front plate.
        parts: [cover, rear_io, side_hatch]
      - title: Base (print one)
        note: P1 for a desktop, or any setup with drive trays; P1M for a wall or robot mount without drive trays.
        parts: [base, base_mount]
        pick_one: true
      - title: Front plate (print one)
        note: P3 with the GMSL camera board fitted, P4 without it.
        parts: [front_gmsl, front_no_gmsl]
        pick_one: true
      - title: Closures and drive storage
        optional: true
        note: P18 closes the floor opening when no drive trays are fitted. Stack 1 tray, 1 of each or 2 of each; P17 goes under the stack on a wall or robot mount; P19 holds 7 mm SSDs that have no bottom screw holes (4 per drive).
        parts: [chimney_cap, storage_35, storage_25, storage_mount_plate, ssd_clip]
      - title: Test prints (print these first, in your filament)
        note: Fits, insert retention and heat resistance depend on the filament; these check them before the big parts.
        parts: [mount_fit_template, m3_insert_coupon, rail_coupon, rail_key, countersink_coupon, rpsma_coupon]
    build: {title: "desktop, no GMSL, no drives", parts: [cover, rear_io, side_hatch, base, front_no_gmsl, chimney_cap]}
    quantities: {ssd_clip: 4}
    notes:
      base: {orientation: floor down on the bed, supports: none, use: "desktop, or any setup with drive trays"}
      base_mount: {orientation: floor down on the bed, supports: none, use: instead of P1 on a wall or robot mount without drive trays}
      cover: {orientation: roof down on the bed, supports: none, use: always}
      rear_io: {orientation: outside face down, supports: none, use: always}
      side_hatch: {orientation: outside face down, supports: none, use: always}
      front_no_gmsl: {orientation: outside face down, supports: none, use: no GMSL board}
      front_gmsl: {orientation: outside face down, supports: none, use: GMSL board fitted}
      chimney_cap: {orientation: flange down, supports: none, use: no drive trays}
      storage_35: {use: one 3.5 in drive each (0 to 2)}
      storage_25: {use: "two 2.5 in drives each, up to 15 mm thick (0 to 2)"}
      storage_mount_plate: {use: wall or robot mount with drive trays}
      ssd_clip: {use: 4 per 7 mm SSD without bottom screw holes}
      mount_fit_template: {checks: the bare board sits flat on all its supports and the cooler holes line up}
      m3_insert_coupon: {checks: which pilot hole (3.7 to 4.1 mm) holds an M3 insert}
      rail_coupon: {checks: plates slide in their channels without rattling (with P13)}
      rail_key: {checks: plates slide in their channels without rattling (with P12)}
      countersink_coupon: {checks: the M3 x 35 flat head seats on its cone}
      rpsma_coupon: {checks: which D-hole flat (5.9 to 6.2 mm) holds an RP-SMA bulkhead without turning}
    pages: [ASSEMBLY.md]
    hardware:
      - {item: M3 x 10 heat-set insert, qty: "8", used for: board supports (4) and lid columns (4)}
      - {item: "M3 x 10 button head, ISO 7380", qty: "4", used for: board to base}
      - {item: "M3 x 35 flat head, DIN 7991 / ISO 10642", qty: "4", used for: "cooler tie-down, up through the floor"}
      - {item: "M3 x 16 socket head, ISO 4762", qty: "4", used for: "lid, from the top (2.5 mm hex key, 40 mm reach)"}
      - {item: "RP-SMA female bulkhead pigtail, to U.FL or MHF4", qty: "0-4", used for: "antennas (2 Wi-Fi, 2 cellular)"}
      - {item: "Rubber bumper, up to 12 x 1 mm", qty: "4", used for: desktop feet (optional)}
      - {item: M6 screws and 16 mm washers, qty: "4", used for: P1M wall or robot mount}
      - {item: SIM eject pin or paper clip (1.2 mm or less), qty: "1", used for: pressing the reset and recovery buttons}
    include: ["cad/**", "tools/**", cad-agent.yaml, requirements.txt, README.md, ASSEMBLY.md, "LICENSE*", references/sources.json]
  # project site: `cad-agent site --serve` (http://127.0.0.1:8643/site/). The top bar below is on every page it serves.
  site:
    title: J501 AGX enclosure
    tagline: A printed enclosure for the Seeed reServer J501 carrier with a Jetson AGX Orin, its cooler, antennas and drives
    notice: "Release 0.9.1: lid for the reComputer mini J501 (G48R) cooler, with the lid-screw counterbores clear of the roof ribs. Checked: CAD fit (±3 mm fan position), every hole of every part, lid FEA (300 N) and CFD with the fan blowing up (40 W, converged). Not yet fit-checked on a print."
    review: exports/cooler-study/review.json
    milestones: docs/milestones.yaml
    pages: [README.md, ASSEMBLY.md, "docs/README.md", "exports/README.md", "cad/README.md", "tools/README.md",
            "preview/README.md", "references/README.md", "docs/assembly/README.md", "docs/cooler-fit-review.md",
            "exports/cooler-study/README.md"]
    live_reload: {watch: [preview, docs, exports, site]}
    nav:
      - {id: overview, title: Overview, href: site/}
      - {id: cooler, title: Cooler fit, href: site/pages/docs-cooler-fit-review-md.html}
      - {id: renders, title: Renders, href: preview/index.html}
      - {id: model, title: 3D model, href: _cadagent/kit/viewer.html}
      - {id: simulation, title: Simulation, href: preview/simulation.html}
      - {id: review, title: Engineering review, href: docs/engineering-review.html}
      - {id: checks, title: Checks, href: docs/cad-agent-report.html}
      - {id: print, title: Print files, href: site/pages/exports-readme-md.html}
      - {id: assembly, title: Assembly, href: site/pages/assembly-md.html}
      - {id: docs, title: Docs, href: "site/#documents"}
      - {id: repo, title: Repository, href: "https://github.com/mvalancy/j501-agx-orin"}
