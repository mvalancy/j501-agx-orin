# Revision milestones, shown on the project site (cad-agent site). Status: done | active | next | blocked.
- {id: R0.2, title: First fit-check build, status: done, done_when: "board, ears and feet fit on the bench"}
- {id: R0.3, title: Print-review pass, status: done, done_when: "rail coupon and key slide without rattle"}
- {id: R0.4, title: Open ribbed lid and larger mounting tabs, status: done, done_when: "lid, tabs and M6 inserts print and fit"}
- {id: R0.5, title: Antennas and service access, status: done, done_when: "4 RP-SMA bulkheads in the fixed base walls; pin holes reach reset and recovery"}
- {id: R0.6, title: Flush shell, cooler tie-down and drive trays, status: done, done_when: "the cooler is screwed down through the floor; trays stack"}
- {id: R0.7, title: Port windows from modelled mating plugs, status: done, done_when: "every plug sweeps in clear; released as rev0.7"}
- {id: R0.8, title: Less filament, a stronger lid and better airflow, status: done, done_when: "lighter by slicer grams, lid deflection no worse than Rev 0.7, airflow and plate temperature checked in CFD, D-flat antenna holes"}
- {id: R0.9, title: The fitted cooler under the lowest lid, status: done, done_when: "the printed Rev 0.8 lid hit the reComputer mini J501 cooler by 15 mm; Rev 0.9 models that cooler and puts its fan 2.4 mm under a flush grille; lid FEA and CFD pass; released as rev0.9, and rev0.9.1 clears the lid-screw counterbores"}
- {id: R0.9F, title: Fit-check a printed Rev 0.9.1, status: next, done_when: "the test prints pass, then the 0.9.1 lid and base are assembled on the board with the cooler and the lid screws seat; physical_fit_verified set in exports/review-validation.json"}
- {id: T1, title: Measure the cooler and the module under load, status: next, done_when: "PCB top to fan top and the fan centre measured; tegrastats stress test logged against the CFD prediction"}
- {id: T2, title: Calibrate the fin-block resistance in CFD, status: next, done_when: "issue #8: the porous fin block reproduces the plate-fin pressure drop and the cooled case agrees with the 31 m³/h operating point"}
